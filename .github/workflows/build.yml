# Pushing a `v*` tag builds the launcher for Linux and Windows and attaches
# both binaries to that tag's GitHub release. Other tags (like the modpack
# release) don't trigger it.
name: build

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Older Ubuntu keeps the glibc requirement low for friends' distros.
          - os: ubuntu-22.04
            binary: ekipamc
            asset: ekipamc-linux-x86_64
          - os: windows-latest
            binary: ekipamc.exe
            asset: ekipamc-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo test
      - run: cargo build --release
      - run: mv target/release/${{ matrix.binary }} ${{ matrix.asset }}
        shell: bash
      # Whichever job finishes first creates the release; the other one's
      # create fails, which is fine (the step runs under bash -e).
      - run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
