# Builds the launcher for Linux and Windows. Pushing a `v*` tag also
# attaches both binaries to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Older Ubuntu keeps the glibc requirement low for friends' distros.
          - os: ubuntu-22.04
            binary: ekipamc
            asset: ekipamc-linux-x86_64
          - os: windows-latest
            binary: ekipamc.exe
            asset: ekipamc-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo test
      - run: cargo build --release
      - run: mv target/release/${{ matrix.binary }} ${{ matrix.asset }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null; gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
