[package]
name = "ekipamc"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "fs", "io-util", "macros", "process"] }
toml = "1.2.2"
uuid = "1.29.3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.19"

[profile.release]
strip = true
